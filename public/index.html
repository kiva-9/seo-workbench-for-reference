<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<title>文案工作台</title>
<script src="./js/theme-preference.js"></script>
<!-- theme.css 是唯一色彩/字阶/间距/圆角来源（由 scripts/gen-theme.mjs 生成），须先于组件样式加载 -->
<link rel="stylesheet" href="./css/theme.css">
<link rel="stylesheet" href="./css/style.css">
<link rel="stylesheet" href="./css/task-management.css">
<link rel="stylesheet" href="./css/article-shell.css">
<link rel="stylesheet" href="./css/article-monitor.css">
<link rel="stylesheet" href="./css/project-workspace.css">
<link rel="stylesheet" href="./css/mcp.css">
<link rel="stylesheet" href="./css/resource-candidates.css">
<link rel="stylesheet" href="./css/ai-insights.css">
<link rel="stylesheet" href="./css/background-tasks.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <span class="brand-logo"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg></span>
      <span class="brand-name">文案工作台</span>
    </div>
    <button id="sidebar-collapse" aria-label="折叠菜单栏" aria-expanded="true" title="折叠菜单栏">‹</button>
    <nav id="nav" aria-label="主要导航">
      <div class="nav-group" role="group" aria-labelledby="nav-workspace-label">
        <h2 class="nav-group-label" id="nav-workspace-label">工作空间</h2>
        <a href="#/task-management" data-route="task-management" class="nav-item active" aria-current="page">
          <svg viewBox="0 0 16 16" width="16" height="16"><rect x="2" y="2" width="5" height="5" rx="1" fill="currentColor"/><rect x="9" y="2" width="5" height="5" rx="1" fill="currentColor"/><rect x="2" y="9" width="5" height="5" rx="1" fill="currentColor"/><rect x="9" y="9" width="5" height="5" rx="1" fill="currentColor"/></svg>
          <span>任务管理</span>
        </a>
        <a href="#/projects" data-route="projects" class="nav-item">
          <svg viewBox="0 0 16 16" width="16" height="16"><path d="M1.5 3.5A1.5 1.5 0 0 1 3 2h3l1.5 2h5.5A1.5 1.5 0 0 1 14.5 5.5v7a1.5 1.5 0 0 1-1.5 1.5h-10a1.5 1.5 0 0 1-1.5-1.5z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
          <span>项目管理</span>
        </a>
        <a href="#/docs" data-route="docs" class="nav-item">
          <svg viewBox="0 0 16 16" width="16" height="16"><path d="M2.5 4a1.5 1.5 0 0 1 1.5-1.5h8A1.5 1.5 0 0 1 13.5 4v1a1 1 0 0 1 1 1v6.5a1.5 1.5 0 0 1-1.5 1.5h-8A1.5 1.5 0 0 1 2.5 12.5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M6 6.5h5M6 9h5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <span>链接库</span>
        </a>
        <a href="#/article-monitor" data-route="article-monitor" class="nav-item">
          <svg viewBox="0 0 16 16" width="16" height="16"><path d="M2 13.5V8M7 13.5V4.5M12 13.5V2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M2 14h12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          <span>文章监控</span>
        </a>
      </div>
      <div class="nav-group" role="group" aria-labelledby="nav-ai-features-label">
        <h2 class="nav-group-label" id="nav-ai-features-label">AI Features</h2>
        <a href="#/ai-insights" data-route="ai-insights" class="nav-item">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="m8 1 2 4 4 2-4 2-2 5-2-5-4-2 4-2Z"/></svg><span>AI 见解</span>
        </a>
        <a href="#/mcp" data-route="mcp" class="nav-item">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 1.5v3m6-3v3M3.5 4.5h9v2a4.5 4.5 0 0 1-9 0zM8 11v3.5"/></svg>
          <span>Agent 接入</span>
        </a>
        <a href="#/ai-settings" data-route="ai-settings" class="nav-item">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="3" width="10" height="10" rx="2"/><path d="M6 0v3m4-3v3M6 13v3m4-3v3M0 6h3m10 0h3M0 10h3m10 0h3M6 6h4v4H6Z"/></svg>
          <span>AI 功能配置</span>
        </a>
      </div>
      <div class="nav-group" role="group" aria-labelledby="nav-system-label">
        <h2 class="nav-group-label" id="nav-system-label">系统管理</h2>
        <a href="#/accounts" data-route="accounts" class="nav-item">
          <svg viewBox="0 0 16 16" width="16" height="16"><circle cx="8" cy="5" r="3" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M2.5 14c0-3 2.5-4.5 5.5-4.5s5.5 1.5 5.5 4.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <span>谷歌账号</span>
        </a>
        <a href="#/project-candidates" data-route="project-candidates" class="nav-item">
          <svg viewBox="0 0 16 16" width="16" height="16"><path d="M8 1.5 14.5 8 8 14.5 1.5 8Z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><span>项目候选</span>
        </a>
        <a href="#/settings" data-route="settings" class="nav-item">
          <svg viewBox="0 0 16 16" width="16" height="16"><circle cx="8" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M12.4 3.6L11 5M5 11l-1.4 1.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <span>设置</span>
        </a>
        <a href="#/background-tasks" data-route="background-tasks" class="nav-item">
          <svg viewBox="0 0 16 16" width="16" height="16"><rect x="2" y="2" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5 5h6M5 8h4M5 11h6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><span>后台任务</span>
        </a>
      </div>
    </nav>
    <div class="sidebar-foot"></div>
  </aside>

  <main id="main">
    <header id="topbar">
      <button id="menu-btn" aria-label="菜单">
        <svg viewBox="0 0 16 16" width="18" height="18"><path d="M2 4h12M2 8h12M2 12h12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <span class="workspace-breadcrumb" aria-hidden="true">工作台 <span>/</span></span>
      <h1 id="page-title">任务管理</h1>
      <div class="appearance-controls">
        <div class="palette-options" role="group" aria-label="颜色主题">
          <button type="button" class="palette-option" data-palette-option="mono" aria-label="黑白经典" title="黑白经典" aria-pressed="false">
            <svg class="palette-preview palette-preview-mono" viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><circle class="palette-preview-soft" cx="10" cy="10" r="8"/><path d="M10 2a8 8 0 0 0 0 16z"/><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor"/></svg>
          </button>
          <button type="button" class="palette-option" data-palette-option="ocean" aria-label="青绿色" title="青绿色" aria-pressed="false">
            <svg class="palette-preview palette-preview-ocean" viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><circle class="palette-preview-soft" cx="10" cy="10" r="8"/><path d="M10 2a8 8 0 0 0 0 16z"/><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor"/></svg>
          </button>
          <button type="button" class="palette-option" data-palette-option="pulse" aria-label="Pulse 暖色" title="Pulse 暖色" aria-pressed="true">
            <svg class="palette-preview palette-preview-pulse" viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><circle class="palette-preview-soft" cx="10" cy="10" r="8"/><path d="M10 2a8 8 0 0 0 0 16z"/><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor"/></svg>
          </button>
        </div>
      <button type="button" id="theme-btn" aria-label="切换深浅色主题" title="切换深浅色主题">
        <svg id="theme-icon" viewBox="0 0 24 24" width="19" height="19"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="currentColor"/></svg>
      </button>
      </div>
    </header>
    <div id="view"></div>
  </main>
</div>

<div id="modal-mask" class="hidden">
  <div id="modal" role="dialog" aria-modal="true"></div>
</div>
<div id="toast" class="hidden"></div>

<!-- app-bootstrap -->
<script type="module" src="./js/app.js" onerror="document.getElementById('view').textContent='页面资源未加载完成，可能正在更新，请刷新页面重试。'"></script>
</body>
</html>
